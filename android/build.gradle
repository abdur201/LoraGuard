buildscript {
    ext {
        buildToolsVersion = "36.0.0"
        minSdkVersion = 24
        compileSdkVersion = 36
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.1.20"
    }
    repositories {
        mavenLocal()
        // Local AsyncStorage repo first to avoid JitPack timeouts
        maven { url "$rootDir/../node_modules/@react-native-async-storage/async-storage/android/local_repo" }
        maven { url "$rootDir/local_repo" }
        google()
        mavenCentral()
        // maven { url "https://www.jitpack.io" } // not needed because local repo has the artifact
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
    }
}

apply plugin: "com.facebook.react.rootproject"

allprojects {
    repositories {
        mavenLocal()
        // Local AsyncStorage repo first to avoid JitPack timeouts
        maven { url "$rootDir/../node_modules/@react-native-async-storage/async-storage/android/local_repo" }
        maven { url "$rootDir/local_repo" }
        google()
        mavenCentral()
        // maven { url "https://www.jitpack.io" } // not needed because local repo has the artifact
    }
}
